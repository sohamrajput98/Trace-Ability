name: Trace-Ability AI Logger

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific Commit SHA (leave blank for bulk scan)'
        required: false
      scan_depth:
        description: 'Number of past commits to scan (e.g., 5, 10, 20)'
        required: false
        default: '1'

jobs:
  log_commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Commits
        run: |
          if [ "${{ github.event.inputs.commit_sha }}" != "" ]; then
            COMMIT_IDS="${{ github.event.inputs.commit_sha }}"
          elif [ "${{ github.event.inputs.scan_depth }}" != "1" ]; then
            echo "Scanning last ${{ github.event.inputs.scan_depth }} commits..."
            COMMIT_IDS=$(git rev-list --max-count=${{ github.event.inputs.scan_depth }} HEAD)
          else
            echo '${{ toJSON(github.event.commits) }}' > commits.json
            COMMIT_IDS=$(jq -r '.[].id' commits.json)
          fi
          
          for COMMIT_ID in $COMMIT_IDS; do
            echo "Processing: $COMMIT_ID"
            DIFF=$(git diff ${COMMIT_ID}^..${COMMIT_ID} || echo "")
            if [ -z "$DIFF" ]; then continue; fi
            
            PAYLOAD=$(jq -n --arg commit_id "$COMMIT_ID" --arg diff "$DIFF" '{commit_id: $commit_id, diff: $diff}')
            curl -s -X POST "https://wqn6vtpx2yrpfqb3qligyyt4ru0vjicb.lambda-url.ap-south-1.on.aws/" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            sleep 5 # Critical for Bedrock rate limits
          done